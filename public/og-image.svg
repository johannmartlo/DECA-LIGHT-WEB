<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- Fondo Canvas -->
  <rect width="1200" height="630" fill="#003B2A"/>

  <!-- Patrón de fondo geométrico sutil -->
  <g opacity="0.08">
    <circle cx="1050" cy="150" r="350" fill="#34D399"/>
    <circle cx="150" cy="500" r="250" fill="#34D399"/>
    <path d="M 0 315 L 1200 315" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="8 8"/>
    <path d="M 600 0 L 600 630" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="8 8"/>
  </g>

  <!-- Tarjeta Central de Marca -->
  <rect x="80" y="80" width="1040" height="470" rx="16" fill="#03271D" stroke="#065F46" stroke-width="2"/>

  <!-- Kicker superior -->
  <rect x="140" y="140" width="32" height="3" rx="1.5" fill="#34D399"/>
  <text x="185" y="144" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="2">
    COORDINACIÓN DOCUMENTAL DE EXPEDICIONES
  </text>

  <!-- Logotipo DECA Light -->
  <text x="140" y="235" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" letter-spacing="-1">
    DECA <tspan fill="#A7F3D0" font-weight="300">Light</tspan>
  </text>

  <!-- Titular descriptivo -->
  <text x="140" y="305" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="600" letter-spacing="-0.5">
    La gestión documental de tus expediciones, más sencilla.
  </text>

  <!-- Párrafo de apoyo -->
  <text x="140" y="360" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
    Capa ligera de coordinación entre los datos del almacén y el transporte
  </text>
  <text x="140" y="392" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
    para almacenes hortofrutícolas y empresas comercializadoras agrícolas.
  </text>

  <!-- Badges inferiores -->
  <g transform="translate(140, 440)">
    <rect width="210" height="38" rx="19" fill="#003B2A" stroke="#059669" stroke-width="1.5"/>
    <circle cx="20" cy="19" r="5" fill="#34D399"/>
    <text x="35" y="24" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">
      PROYECTO EN DESARROLLO
    </text>

    <rect x="230" width="180" height="38" rx="19" fill="#003B2A" stroke="#D97706" stroke-width="1.5"/>
    <circle cx="250" cy="19" r="5" fill="#F59E0B"/>
    <text x="265" y="24" fill="#FDE68A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">
      PROGRAMA PILOTO
    </text>
  </g>

  <!-- Gráfico decorativo de flujo a la derecha -->
  <g transform="translate(850, 160)">
    <rect width="210" height="110" rx="12" fill="#003B2A" stroke="#047857" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="12" fill="#047857"/>
    <path d="M 25 30 L 29 34 L 36 26" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="52" y="34" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Almacén</text>
    <text x="25" y="65" fill="#94A3B8" font-family="monospace" font-size="12">EXP-2026-1047</text>
    <text x="25" y="85" fill="#6EE7B7" font-family="-apple-system, sans-serif" font-size="12">Albarán preparado</text>

    <path d="M 105 110 L 105 160" stroke="#34D399" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="105" cy="160" r="4" fill="#34D399"/>

    <rect y="170" width="210" height="110" rx="12" fill="#003B2A" stroke="#059669" stroke-width="2"/>
    <text x="25" y="205" fill="#34D399" font-family="-apple-system, sans-serif" font-size="16" font-weight="800">DECA Light</text>
    <text x="25" y="230" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">DECA Validado</text>
    <text x="25" y="255" fill="#A7F3D0" font-family="-apple-system, sans-serif" font-size="12">Listo para revisión</text>
  </g>
</svg>
